<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrenman Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 16px;
    background: #111827; color: #f3f4f6;
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 520px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 14px; }
  h2 { font-size: 1rem; color: #9ca3af; margin: 22px 0 8px; font-weight: 500; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input, select, button {
    padding: 11px; border-radius: 8px; border: 1px solid #374151;
    background: #1f2937; color: #f3f4f6; font-size: 1rem; font-family: inherit;
  }
  button { border: none; cursor: pointer; font-weight: 600; }
  #save-btn { background: #2563eb; }
  #save-btn:active { background: #1d4ed8; }
  #add-set-btn { background: #374151; }
  .set-row { display: flex; gap: 6px; align-items: center; }
  .set-no { flex: 0 0 26px; color: #9ca3af; font-size: .85rem; text-align: center; }
  .set-row input { flex: 1; min-width: 0; }
  .remove-set { flex: 0 0 42px; background: #4b5563; padding: 11px 0; }
  #feedback { margin: 12px 0; font-size: .92rem; min-height: 1.3em; }
  .up { color: #4ade80; }
  .down { color: #f87171; }
  .same { color: #9ca3af; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { padding: 7px 4px; text-align: left; border-bottom: 1px solid #374151; vertical-align: top; }
  th { color: #9ca3af; font-weight: 500; }
  td.vol { font-weight: 600; white-space: nowrap; }
  .del-btn { background: none; color: #6b7280; padding: 0 4px; font-size: .95rem; }
  canvas { width: 100%; height: 170px; background: #1f2937; border-radius: 8px; }
  .backup { display: flex; gap: 8px; margin: 20px 0 8px; }
  .backup button { flex: 1; background: #374151; font-size: .9rem; }
  .hint { color: #6b7280; font-size: .78rem; margin-top: 4px; }
</style>
</head>
<body>
  <h1>🏋️ Antrenman Log</h1>

  <form id="entry-form" autocomplete="off">
    <select id="exercise-picker"></select>
    <input list="exercise-list" id="exercise" placeholder="veya hareket adı yaz" required>
    <datalist id="exercise-list"></datalist>
    <input type="date" id="date" required>

    <div id="sets-container"></div>

    <button type="button" id="add-set-btn">+ Set Ekle</button>
    <button type="submit" id="save-btn">Kaydet</button>
  </form>

  <div id="feedback"></div>

  <h2>Grafik</h2>
  <select id="exercise-filter"></select>
  <canvas id="chart" width="480" height="170" style="margin-top:8px"></canvas>

  <h2>Geçmiş</h2>
  <table>
    <thead><tr><th>Tarih</th><th>Hareket</th><th>Setler</th><th>Hacim</th><th></th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>

  <div class="backup">
    <button id="export-btn">⬇️ Yedekle</button>
    <button id="import-btn">⬆️ Yedekten Yükle</button>
    <input type="file" id="import-input" accept="application/json" style="display:none">
  </div>
  <div class="hint">Veriler bu cihazda saklanır. Düzenli olarak yedek al.</div>

<script>
const STORAGE_KEY = 'workoutEntries';

const PRESET_EXERCISES = [
  'High Knees Running in Place',
  'Single Arm Row',
  'Bent Over Row with Dumbbell',
  'Kettlebell Renegade Row',
  'Bench Press with Dumbbell Hammer Grip',
  'Push Up',
  'Fly',
  'Hammer Curl',
  'Seated Triceps Extension',
  'Single Arm Front Raise with Dumbbell',
  'Side Lateral Raise with Dumbbell',
  'Seated Shoulder Press with Dumbbell'
];

let entries = [];
try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { entries = []; }

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  catch (e) { alert('Kaydedilemedi: depolama alanı dolu olabilir.'); }
}

const form = document.getElementById('entry-form');
const picker = document.getElementById('exercise-picker');
const exerciseInput = document.getElementById('exercise');
const exerciseList = document.getElementById('exercise-list');
const dateInput = document.getElementById('date');
const setsContainer = document.getElementById('sets-container');
const addSetBtn = document.getElementById('add-set-btn');
const feedback = document.getElementById('feedback');
const filter = document.getElementById('exercise-filter');
const historyBody = document.getElementById('history-body');
const ctx = document.getElementById('chart').getContext('2d');

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayOf(e) { return String(e.date).slice(0, 10); }
function fmtDate(key) {
  const p = key.split('-');
  return p[2] + '.' + p[1] + '.' + p[0];
}
function setsOf(e) {
  if (Array.isArray(e.sets)) return e.sets;
  return [{ weight: e.weight, reps: e.reps, count: e.sets || 1 }];
}
function summary(e) {
  return setsOf(e).map(function (s) {
    return (s.count && s.count > 1 ? s.count + '×' : '') + s.reps + ' tekrar @ ' + s.weight + ' lb';
  }).join('<br>');
}
function volumeOf(sets) {
  return sets.reduce(function (sum, s) { return sum + s.weight * s.reps * (s.count || 1); }, 0);
}
function sortKey(e) { return dayOf(e) + '-' + String(e.id || 0).padStart(15, '0'); }

function addSetRow(weight, reps) {
  const row = document.createElement('div');
  row.className = 'set-row';
  row.innerHTML =
    '<span class="set-no"></span>' +
    '<input type="number" class="set-weight" placeholder="lb" step="0.5" min="0" value="' + (weight || '') + '" required>' +
    '<input type="number" class="set-reps" placeholder="tekrar" step="1" min="1" value="' + (reps || '') + '" required>' +
    '<button type="button" class="remove-set">✕</button>';
  row.querySelector('.remove-set').addEventListener('click', function () {
    if (setsContainer.children.length > 1) { row.remove(); renumber(); }
  });
  setsContainer.appendChild(row);
  renumber();
}
function renumber() {
  Array.prototype.forEach.call(setsContainer.children, function (r, i) {
    r.querySelector('.set-no').textContent = (i + 1) + '.';
  });
}
function resetForm() {
  exerciseInput.value = '';
  picker.value = '';
  dateInput.value = todayStr();
  setsContainer.innerHTML = '';
  addSetRow();
}

function allNames() {
  const used = entries.map(function (e) { return e.exercise; });
  const set = {};
  const out = [];
  PRESET_EXERCISES.concat(used).forEach(function (n) {
    if (n && !set[n]) { set[n] = 1; out.push(n); }
  });
  return out;
}

function renderPickers() {
  picker.innerHTML = '<option value="">— Hazır hareket seç —</option>' +
    allNames().map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
  exerciseList.innerHTML = allNames().map(function (n) { return '<option value="' + n + '">'; }).join('');

  const used = [];
  const seen = {};
  entries.forEach(function (e) { if (!seen[e.exercise]) { seen[e.exercise] = 1; used.push(e.exercise); } });
  const cur = filter.value;
  filter.innerHTML = '<option value="">Tüm hareketler</option>' +
    used.map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
  filter.value = used.indexOf(cur) >= 0 ? cur : '';
}

function renderHistory() {
  const f = filter.value;
  const list = (f ? entries.filter(function (e) { return e.exercise === f; }) : entries.slice())
    .sort(function (a, b) { return sortKey(b) < sortKey(a) ? -1 : 1; });

  if (!list.length) {
    historyBody.innerHTML = '<tr><td colspan="5" style="color:#6b7280">Henüz kayıt yok.</td></tr>';
    return;
  }
  historyBody.innerHTML = list.slice(0, 50).map(function (e) {
    return '<tr>' +
      '<td>' + fmtDate(dayOf(e)) + '</td>' +
      '<td>' + e.exercise + '</td>' +
      '<td>' + summary(e) + '</td>' +
      '<td class="vol">' + e.volume + ' lb</td>' +
      '<td><button class="del-btn" data-id="' + e.id + '">🗑</button></td>' +
      '</tr>';
  }).join('');

  Array.prototype.forEach.call(historyBody.querySelectorAll('.del-btn'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('Bu kayıt silinsin mi?')) return;
      const id = b.getAttribute('data-id');
      entries = entries.filter(function (e) { return String(e.id) !== id; });
      save();
      renderAll();
    });
  });
}

function renderChart() {
  const canvas = ctx.canvas;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let name = filter.value;
  if (!name) {
    const counts = {};
    entries.forEach(function (e) { counts[e.exercise] = (counts[e.exercise] || 0) + 1; });
    let best = null;
    Object.keys(counts).forEach(function (k) { if (!best || counts[k] > counts[best]) best = k; });
    name = best;
  }
  if (!name) return;

  const data = entries.filter(function (e) { return e.exercise === name; })
    .sort(function (a, b) { return sortKey(a) < sortKey(b) ? -1 : 1; });
  if (!data.length) return;

  const vols = data.map(function (e) { return e.volume; });
  const max = Math.max.apply(null, vols);
  const min = Math.min.apply(null, vols);
  const range = (max - min) || (max || 1);
  const padL = 30, padR = 14, padT = 26, padB = 20;
  const w = canvas.width - padL - padR;
  const h = canvas.height - padT - padB;

  function px(i) { return padL + (data.length === 1 ? w / 2 : (i / (data.length - 1)) * w); }
  function py(v) { return padT + h - ((v - min) / range) * h; }

  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + h); ctx.lineTo(padL + w, padT + h); ctx.stroke();

  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach(function (e, i) { i ? ctx.lineTo(px(i), py(e.volume)) : ctx.moveTo(px(i), py(e.volume)); });
  ctx.stroke();

  ctx.fillStyle = '#3b82f6';
  data.forEach(function (e, i) {
    ctx.beginPath(); ctx.arc(px(i), py(e.volume), 3.5, 0, Math.PI * 2); ctx.fill();
  });

  ctx.fillStyle = '#9ca3af';
  ctx.font = '11px sans-serif';
  ctx.fillText(name + ' — toplam hacim (lb)', padL, 14);
  ctx.fillText(String(max), 2, py(max) + 4);
  if (max !== min) ctx.fillText(String(min), 2, py(min) + 4);
  ctx.fillText(fmtDate(dayOf(data[0])).slice(0, 5), padL, canvas.height - 5);
  if (data.length > 1) {
    const last = fmtDate(dayOf(data[data.length - 1])).slice(0, 5);
    ctx.fillText(last, padL + w - ctx.measureText(last).width, canvas.height - 5);
  }
}

function renderAll() { renderPickers(); renderHistory(); renderChart(); }

picker.addEventListener('change', function () {
  if (picker.value) { exerciseInput.value = picker.value; }
});
filter.addEventListener('change', function () { renderHistory(); renderChart(); });
addSetBtn.addEventListener('click', function () { addSetRow(); });

form.addEventListener('submit', function (ev) {
  ev.preventDefault();
  const name = exerciseInput.value.trim();
  if (!name) return;

  const sets = [];
  let bad = false;
  Array.prototype.forEach.call(setsContainer.querySelectorAll('.set-row'), function (r) {
    const wv = parseFloat(r.querySelector('.set-weight').value);
    const rv = parseInt(r.querySelector('.set-reps').value, 10);
    if (isNaN(wv) || isNaN(rv)) { bad = true; return; }
    sets.push({ weight: wv, reps: rv, count: 1 });
  });
  if (bad || !sets.length) {
    feedback.innerHTML = '<span class="down">Tüm set alanlarını doldur.</span>';
    return;
  }

  const day = dateInput.value || todayStr();
  const volume = volumeOf(sets);

  const prior = entries.filter(function (e) { return e.exercise === name; })
    .sort(function (a, b) { return sortKey(b) < sortKey(a) ? -1 : 1; })[0];

  entries.push({ id: Date.now(), exercise: name, date: day, sets: sets, volume: volume });
  save();

  if (prior) {
    const diff = volume - prior.volume;
    const pct = prior.volume ? (diff / prior.volume * 100).toFixed(1) : '0.0';
    if (diff > 0) feedback.innerHTML = '<span class="up">▲ ' + volume + ' lb — önceki ' + prior.volume + ' lb (' + fmtDate(dayOf(prior)) + ') · +' + diff + ' lb, %' + pct + '</span>';
    else if (diff < 0) feedback.innerHTML = '<span class="down">▼ ' + volume + ' lb — önceki ' + prior.volume + ' lb (' + fmtDate(dayOf(prior)) + ') · ' + diff + ' lb, %' + pct + '</span>';
    else feedback.innerHTML = '<span class="same">= ' + volume + ' lb — önceki seansla aynı</span>';
  } else {
    feedback.innerHTML = '<span class="same">İlk kayıt — toplam hacim: ' + volume + ' lb</span>';
  }

  resetForm();
  renderAll();
});

document.getElementById('export-btn').addEventListener('click', function () {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'antrenman-yedek-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
});

document.getElementById('import-btn').addEventListener('click', function () {
  document.getElementById('import-input').click();
});
document.getElementById('import-input').addEventListener('change', function (ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (r) {
    try {
      const imported = JSON.parse(r.target.result);
      if (!Array.isArray(imported)) throw new Error('format');
      const have = {};
      entries.forEach(function (e) { have[String(e.id)] = 1; });
      let added = 0;
      imported.forEach(function (e) {
        if (e && e.exercise && !have[String(e.id)]) { entries.push(e); added++; }
      });
      save();
      renderAll();
      feedback.innerHTML = '<span class="same">Yedek yüklendi — ' + added + ' yeni kayıt eklendi.</span>';
    } catch (err) {
      feedback.innerHTML = '<span class="down">Yedek dosyası okunamadı.</span>';
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}

resetForm();
renderAll();
</script>
</body>
</html>
